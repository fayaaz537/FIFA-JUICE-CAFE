<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIFA JUICE & CAFE - Owner Dashboard</title>

<style>
body{
  font-family:Arial,sans-serif;
  margin:0;
  background:#f4f4f4;
  color:#222;
}
header{
  background:#111;
  color:white;
  padding:18px;
  text-align:center;
}
.container{
  max-width:1000px;
  margin:20px auto;
  padding:0 15px;
}
#loginBox{
  max-width:400px;
  margin:50px auto;
  background:white;
  padding:25px;
  border-radius:12px;
  box-shadow:0 2px 10px #ccc;
}
input,button{
  width:100%;
  box-sizing:border-box;
  padding:12px;
  margin:7px 0;
  border-radius:7px;
  border:1px solid #ccc;
}
button{
  border:0;
  cursor:pointer;
  font-weight:bold;
}
.loginBtn{background:#111;color:white;}
.logout{background:#d32f2f;color:white;max-width:150px;}
.order{
  background:white;
  margin:15px 0;
  padding:18px;
  border-radius:12px;
  box-shadow:0 2px 8px #ddd;
}
.order h3{margin-top:0;}
.items{
  background:#f5f5f5;
  padding:10px;
  border-radius:8px;
}
.status{
  font-weight:bold;
  margin:10px 0;
}
.statusBtn{
  width:auto;
  padding:9px 12px;
  margin-right:5px;
  background:#222;
  color:white;
}
#dashboard{display:none;}
.error{color:#d32f2f;}
</style>
</head>

<body>

<header>
  <h1>FIFA JUICE & CAFE</h1>
  <p>Owner Dashboard</p>
</header>

<div id="loginBox">
  <h2>Owner Login</h2>

  <input id="email" type="email" placeholder="Owner Email">
  <input id="password" type="password" placeholder="Password">

  <button class="loginBtn" onclick="login()">LOGIN</button>

  <p id="loginError" class="error"></p>
</div>

<div id="dashboard">

  <div class="container">

    <button class="logout" onclick="logout()">LOGOUT</button>

    <h2>📦 Orders</h2>

    <div id="orders">
      Loading orders...
    </div>

  </div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  query,
  orderBy,
  onSnapshot,
  doc,
  updateDoc
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


const firebaseConfig = {
  apiKey: "AIzaSyC-MteBY5MtE4OLRjbVkh8tTQEm3DQ79ik",
  authDomain: "fifa-juice-cafe.firebaseapp.com",
  projectId: "fifa-juice-cafe",
  storageBucket: "fifa-juice-cafe.firebasestorage.app",
  messagingSenderId: "607943642691",
  appId: "1:607943642691:web:4d24f2c55a03eb686bcef6"
};


const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);


window.login = async function(){

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  try{

    await signInWithEmailAndPassword(auth,email,password);

  }catch(error){

    document.getElementById("loginError").textContent =
      "Login failed. Email/password check cheyyuka.";

  }

};


window.logout = async function(){

  await signOut(auth);

};


onAuthStateChanged(auth,(user)=>{

  if(user){

    document.getElementById("loginBox").style.display="none";
    document.getElementById("dashboard").style.display="block";

    loadOrders();

  }else{

    document.getElementById("loginBox").style.display="block";
    document.getElementById("dashboard").style.display="none";

  }

});


function loadOrders(){

  const ordersDiv = document.getElementById("orders");

  const q = query(
    collection(db,"orders"),
    orderBy("createdAt","desc")
  );

  onSnapshot(q,(snapshot)=>{

    ordersDiv.innerHTML="";

    if(snapshot.empty){

      ordersDiv.innerHTML="<p>No orders yet.</p>";
      return;

    }

    snapshot.forEach((item)=>{

      const order = item.data();

      let itemsHTML="";

      if(order.items){

        order.items.forEach(x=>{

          itemsHTML += `
            <div>
              ${x.name} × ${x.quantity}
              — ₹${x.subtotal}
            </div>
          `;

        });

      }

      const div=document.createElement("div");

      div.className="order";

      div.innerHTML=`

        <h3>Order #${order.orderNumber || "N/A"}</h3>

        <p>
          <b>Customer:</b>
          ${order.customerName || "N/A"}
        </p>

        <p>
          <b>Phone:</b>
          ${order.phone || "N/A"}
        </p>

        <p>
          <b>Address:</b>
          ${order.address || "N/A"}
        </p>

        <p>
          <b>Order Type:</b>
          ${order.orderType || "N/A"}
        </p>

        <div class="items">
          <b>Items:</b>
          ${itemsHTML}
        </div>

        <p>
          <b>Total:</b> ₹${order.total || 0}
        </p>

        <p class="status">
          Status: ${order.status || "New"}
        </p>

        <button class="statusBtn"
          onclick="changeStatus('${item.id}','New')">
          New
        </button>

        <button class="statusBtn"
          onclick="changeStatus('${item.id}','Preparing')">
          Preparing
        </button>

        <button class="statusBtn"
          onclick="changeStatus('${item.id}','Out for Delivery')">
          Out for Delivery
        </button>

        <button class="statusBtn"
          onclick="changeStatus('${item.id}','Completed')">
          Completed
        </button>

      `;

      ordersDiv.appendChild(div);

    });

  });

}


window.changeStatus = async function(id,status){

  try{

    await updateDoc(
      doc(db,"orders",id),
      {status:status}
    );

  }catch(error){

    alert("Status update cheyyan pattiyilla.");

  }

};

</script>

</body>
</html>
